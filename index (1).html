<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><title>Tithi’s Gift Quiz</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=Quicksand:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{--bg1:#0a0820;--bg2:#1c1247;--gold:#ffd98a;--glow:#b79cff;--ink:#f3ecff;--card:rgba(30,22,74,.72);--line:rgba(183,156,255,.35);box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;color:var(--ink);font-family:Quicksand,system-ui,sans-serif;background:linear-gradient(180deg,var(--bg1),var(--bg2) 70%,#3a1d63);background-attachment:fixed;overflow-x:hidden}
h1,h2,h3{font-family:Cinzel,Georgia,serif;color:var(--gold);margin:.3em 0;text-shadow:0 0 14px rgba(255,217,138,.45)}
#sky{position:fixed;inset:0;z-index:0;pointer-events:none}
.st{position:absolute;border-radius:50%;background:#fff;animation:tw 3s infinite ease-in-out}
@keyframes tw{0%,100%{opacity:.2;transform:scale(.7)}50%{opacity:1;transform:scale(1.3)}}
.sh{position:absolute;width:120px;height:2px;background:linear-gradient(90deg,#fff,transparent);transform:rotate(25deg);opacity:0;animation:shoot 7s infinite}
@keyframes shoot{0%{opacity:0;transform:translate(0,0) rotate(25deg)}3%{opacity:1}12%{opacity:0;transform:translate(420px,200px) rotate(25deg)}100%{opacity:0}}
#castle{position:fixed;left:0;right:0;bottom:0;height:150px;z-index:0;pointer-events:none;opacity:.55}
main{position:relative;z-index:1;max-width:760px;margin:0 auto;padding:18px 16px 170px}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:18px;margin:14px 0;backdrop-filter:blur(6px);box-shadow:0 0 28px rgba(120,80,255,.18)}
.enter{animation:enter .7s cubic-bezier(.2,.9,.3,1.2) both}
@keyframes enter{from{opacity:0;transform:translateY(30px) scale(.94);filter:blur(6px)}to{opacity:1;transform:none;filter:none}}
button,.chip{font:inherit;cursor:pointer;border-radius:12px;border:1px solid var(--line);background:rgba(255,255,255,.07);color:var(--ink);padding:10px 14px;transition:.2s}
button:hover,.chip:hover{box-shadow:0 0 16px var(--glow);transform:translateY(-1px)}
.opt{display:block;width:100%;text-align:left;margin:8px 0}
.go{background:linear-gradient(135deg,#7b5cff,#c07bff);border:0;font-weight:700;color:#fff}
.chip{display:inline-block;margin:3px;padding:6px 12px;font-size:.9rem}
.chip.on{background:var(--gold);color:#2a1a55;font-weight:700}
input[type=text],input[type=number]{width:100%;padding:11px;border-radius:10px;border:1px solid var(--line);background:rgba(0,0,0,.35);color:var(--ink);font:inherit;margin:6px 0}
.small{font-size:.85rem;opacity:.8}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center;justify-content:space-between}
.gift{display:flex;gap:12px;align-items:center}
.gift img,.thumb{width:72px;height:72px;object-fit:cover;border-radius:12px;border:1px solid var(--line)}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.stat{text-align:center}.stat b{font-size:1.8rem;color:var(--gold);display:block}
.sw{position:relative;width:58px;height:30px;border-radius:30px;background:#444;border:1px solid var(--line);cursor:pointer;padding:0}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;transition:.3s}
.sw.on{background:#7b5cff;box-shadow:0 0 18px var(--glow)}.sw.on::after{left:31px}
.alert{border-left:4px solid #ff8aa8}
.spark{position:fixed;z-index:9;pointer-events:none;font-size:18px;animation:sp 1s forwards}
@keyframes sp{to{transform:translate(var(--dx),var(--dy)) scale(.2);opacity:0}}
.hero{text-align:center;padding:6px 0}
.float{animation:fl 5s infinite ease-in-out}@keyframes fl{50%{transform:translateY(-10px)}}
.win{animation:wn 3s infinite}@keyframes wn{0%,100%{opacity:.4}50%{opacity:1}}
#sky::before{content:"";position:absolute;inset:0;background:radial-gradient(ellipse at 20% 10%,rgba(123,92,255,.35),transparent 50%),radial-gradient(ellipse at 80% 30%,rgba(255,120,200,.2),transparent 50%);animation:aur 14s infinite alternate}@keyframes aur{to{transform:scale(1.2) translateX(30px);opacity:.6}}
.cloud{position:absolute;width:220px;height:60px;border-radius:60px;background:rgba(200,180,255,.16);filter:blur(10px);box-shadow:70px -26px 0 8px rgba(200,180,255,.14),-60px 8px 0 -4px rgba(200,180,255,.12);animation:drift linear infinite}@keyframes drift{from{transform:translateX(-380px)}to{transform:translateX(115vw)}}
.moon{position:absolute;right:7%;top:6%;width:70px;height:70px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#fffbe8,#ffe9a8 60%,#e8c76a);box-shadow:0 0 40px 14px rgba(255,233,168,.45),0 0 120px 40px rgba(183,156,255,.25);animation:fl 7s infinite ease-in-out}
.ff{position:absolute;width:6px;height:6px;border-radius:50%;background:#ffe9a8;box-shadow:0 0 12px 4px rgba(255,217,138,.8);animation:wander 9s infinite ease-in-out}@keyframes wander{0%,100%{transform:translate(0,0);opacity:.2}25%{transform:translate(40px,-60px);opacity:1}50%{transform:translate(-30px,-110px);opacity:.4}75%{transform:translate(50px,-50px);opacity:1}}
.swirl{position:fixed;inset:0;z-index:8;pointer-events:none;background:radial-gradient(circle at var(--x) var(--y),rgba(183,156,255,.6),rgba(255,217,138,.28) 30%,transparent 62%);animation:wipe 1.2s ease-out forwards}@keyframes wipe{0%{clip-path:circle(0 at var(--x) var(--y));opacity:1}55%{clip-path:circle(150% at var(--x) var(--y));opacity:.9}100%{clip-path:circle(150% at var(--x) var(--y));opacity:0}}
.swirl i{position:absolute;bottom:-30px;color:#ffd98a;font-style:normal;text-shadow:0 0 10px #ffd98a;animation:rise 1.1s ease-in forwards}@keyframes rise{to{transform:translateY(-110vh) rotate(360deg);opacity:0}}
@media(prefers-reduced-motion:reduce){*{animation:none!important}}
</style></head><body>
<div id="sky"></div>
<svg id="castle" viewBox="0 0 800 150" preserveAspectRatio="xMidYMax slice"><path fill="#07051a" d="M0 150V110h40V90h20v20h30V70l15-25 15 25v40h30V95h20v15h40V60l20-35 20 35v50h40V85h25v25h45V50l25-40 25 40v60h40V80h20v30h35V65l18-28 18 28v45h40V90h25v20h40V70l15-25 15 25v40h50V100h20v10h70v40z"/><g fill="#ffd98a"><rect class="win" x="258" y="72" width="6" height="10"/><rect class="win" x="408" y="62" width="6" height="10"/><rect class="win" x="538" y="78" width="6" height="10" style="animation-delay:1s"/><rect class="win" x="72" y="75" width="5" height="9" style="animation-delay:2s"/></g></svg>
<main id="app"><div class="card">Loading the enchanted realm…</div></main>
<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js";
import {getFirestore,doc as fdoc,collection as fcol,setDoc,updateDoc,deleteDoc,onSnapshot} from "https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js";
import {getAuth,signInWithEmailAndPassword,signOut,onAuthStateChanged} from "https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js";
import {firebaseConfig,OWNER_EMAIL} from "./config.js";
const fbApp=initializeApp(firebaseConfig),fs=getFirestore(fbApp),auth=getAuth(fbApp);
const db={doc:p=>{const r=fdoc(fs,...p.split('/'));return{set:d=>setDoc(r,d),update:d=>updateDoc(r,d),delete:()=>deleteDoc(r),onSnapshot:(a,b)=>onSnapshot(r,a,b)}},collection:n=>({onSnapshot:(a,b)=>onSnapshot(fcol(fs,n),a,b)})};
function shrink(f){return new Promise((ok,no)=>{const im=new Image();im.onload=()=>{const k=Math.min(1,700/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=im.width*k;c.height=im.height*k;c.getContext('2d').drawImage(im,0,0,c.width,c.height);ok(c.toDataURL('image/jpeg',.72))};im.onerror=no;im.src=URL.createObjectURL(f)})}
const $=document.getElementById.bind(document),app=$('app');
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const OCC=['Birthday','Christmas/New Years','There is no special reason, I just think Tithi is iconic','Diwali','Tithi has made some major accomplishment (social, cultural, academic, career)','Rakshabandhan'];
const CLO=['Best Friend','Immediate Family/Mama or Maasi or 1st cousin/Kaku, Kaki or Dhyana','Close friend/friend/dad or moms friend','Family (2nd cousin onwards)','Acquaintance/collegue/classmate/peer'];
const TIER=[['u500','Under 500'],['500-1000','500 to 1000'],['1-5k','1000 to 5000'],['u10k','Under 10,000'],['gen',"I'm feeling generous, surprise me"]];
const CATS0=['Jewellery','Beauty','Fashion','Books','Tech','Home Decor','Food','Experience'];
// sky
(function(){let h='';for(let i=0;i<90;i++){const s=Math.random()*2.5+1;h+=`<i class="st" style="left:${Math.random()*100}%;top:${Math.random()*85}%;width:${s}px;height:${s}px;animation-delay:${Math.random()*3}s"></i>`}
for(let i=0;i<3;i++)h+=`<i class="sh" style="left:${Math.random()*50}%;top:${Math.random()*30}%;animation-delay:${i*2.5}s"></i>`;for(let i=0;i<7;i++)h+=`<i class="cloud" style="top:${5+Math.random()*60}%;animation-duration:${50+Math.random()*50}s;animation-delay:-${Math.random()*80}s;transform:scale(${.7+Math.random()})"></i>`;h+='<i class="moon"></i>';for(let i=0;i<20;i++)h+=`<i class="ff" style="left:${Math.random()*100}%;top:${40+Math.random()*55}%;animation-delay:-${Math.random()*9}s;animation-duration:${7+Math.random()*6}s"></i>`;$('sky').innerHTML=h})();
function swirl(b){const r=b.getBoundingClientRect(),o=document.createElement('div');o.className='swirl';o.style.setProperty('--x',(r.left+r.width/2)+'px');o.style.setProperty('--y',(r.top+r.height/2)+'px');let h='';for(let i=0;i<28;i++)h+=`<i style="left:${Math.random()*100}%;animation-delay:${Math.random()*.4}s;font-size:${12+Math.random()*20}px">${['✦','✧','★','☁','✨'][i%5]}</i>`;o.innerHTML=h;document.body.appendChild(o);setTimeout(()=>o.remove(),1300)}
function burst(e){for(let i=0;i<10;i++){const s=document.createElement('span');s.className='spark';s.textContent=['✦','✧','★','✨'][i%4];s.style.left=(e.clientX||innerWidth/2)+'px';s.style.top=(e.clientY||innerHeight/2)+'px';s.style.setProperty('--dx',(Math.random()*160-80)+'px');s.style.setProperty('--dy',(Math.random()*160-80)+'px');s.style.color='#ffd98a';document.body.appendChild(s);setTimeout(()=>s.remove(),1000)}}
document.addEventListener('click',e=>{if(e.target.closest('button,.chip'))burst(e)});
let items=[],res=[],attempts=[],alerts=[],shield=false,ready=false;
const snap=(name,cb)=>db.collection(name).onSnapshot(s=>{cb(s.docs.map(d=>({id:d.id,...d.data()})));render()},()=>{});
async function init(){
 onAuthStateChanged(auth,u=>{if(u){startOwner();render()}else{ownerMode=false;alerts=[];attempts=[];ownerSubs=false;render()}});
 snap('items',v=>items=v);snap('res',v=>res=v);
 db.doc('cfg/shield').onSnapshot(d=>{shield=!!(d.data()||{}).on;render()},()=>{});
 if(location.hash==='#owner')Q.step='pw';
 ready=true;render()}
let ownerMode=false,ownerSubs=false;const isOwnerView=()=>ownerMode;
function startOwner(){ownerMode=true;if(!ownerSubs){ownerSubs=true;snap('alerts',v=>alerts=v);snap('attempts',v=>attempts=v)}}
async function tryPw(){try{await signInWithEmailAndPassword(auth,OWNER_EMAIL,$('pw').value)}catch(e){$('pwerr').textContent='That is not the magic word. 🌙'}}
addEventListener('hashchange',()=>{location.reload()});
const resIds=()=>new Set(res.map(r=>r.itemId));
const avail=()=>items.filter(i=>i.status!=='wishlist'&&(!shield||!resIds().has(i.id)));
// ---------- QUIZ ----------
let Q={step:'name',name:'',occ:null,clo:null,bud:null,mine:new Set(),outcome:null};
function match(){const rs=resIds();let l=items.filter(i=>i.status!=='wishlist'&&!(shield&&rs.has(i.id)));
 if(Q.clo===3)return l.filter(i=>i.price!=null&&i.price!==''?+i.price<1500:(i.tiers||[]).some(t=>t==='u500'||t==='500-1000'));
 const bi=TIER.findIndex(t=>t[0]===Q.bud);
 return l.filter(i=>(!(i.occasions||[]).length||i.occasions.includes(Q.occ))&&(!(i.closeness||[]).length||i.closeness.includes(Q.clo))&&(Q.bud==='gen'||(i.tiers||[]).some(t=>TIER.findIndex(x=>x[0]===t)<=bi)))}
function frame(h){app.innerHTML=`<div class="card enter" id="step">${h}</div>`}
function quiz(){
 if(Q.step==='name')return frame(`<div class="hero"><div class="float" style="font-size:3rem">🏰✨</div><h1>Tithi's gift Quiz</h1></div><p>This way, you dont have to do research or gift-hunting and she gets what she wants, both parties are happier!</p><input type="text" id="nm" placeholder="Enter your real name" maxlength="60"><button class="go" id="start">Start Quiz</button> <button id="own">🔮 Owner dashboard</button>`),$('own').onclick=()=>{Q.step='pw';render()},
  $('start').onclick=async()=>{const n=$('nm').value.trim();if(!n){$('nm').focus();return}Q={step:'occ',name:n,mine:new Set()};try{await db.doc('attempts/'+uid()).set({name:n,ts:Date.now()})}catch(e){}render()};
 if(Q.step==='pw')return frame(`<h2>🔮 Owner’s tower</h2><p class="small">Speak the magic word to enter.</p><input type="text" id="pw" placeholder="Password" autocomplete="off"><p id="pwerr" class="small" style="color:#ff8aa8"></p><button class="go" id="pwgo">Enter</button> <button id="pwb">Back</button>`),$('pwgo').onclick=tryPw,$('pw').onkeydown=e=>{if(e.key==='Enter')tryPw()},$('pwb').onclick=()=>{Q={step:'name',mine:new Set()};render()};
 if(Q.step==='occ')return ask('Whats the occasion?',OCC,i=>{Q.occ=OCC[i];Q.step='clo'});
 if(Q.step==='clo')return ask('How close are we? (please google for clarity)',CLO,i=>{Q.clo=i;Q.step=i===3?'res':'bud'});
 if(Q.step==='bud')return ask('Your budget? How much financial damage is your account ready to take?',TIER.map(t=>t[1]),i=>{Q.bud=TIER[i][0];Q.step='res'});
 if(Q.step==='res')return results();
 if(Q.step==='end')return frame(`<div class="hero"><div class="float" style="font-size:3rem">🌟</div><h1>Thank you, ${esc(Q.name)}!</h1><p>Tithi thanks you for your time. A little magic is on its way. ✨</p><button id="again">Take the quiz again</button></div>`),$('again').onclick=()=>{Q={step:'name',mine:new Set()};render()}}
function ask(t,opts,pick){frame(`<h2>${esc(t)}</h2>`+opts.map((o,i)=>`<button class="opt enter" style="animation-delay:${.15*i+.25}s" data-i="${i}">${esc(o)}</button>`).join(''));
 document.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{const s=$('step');s.style.transition='.4s';s.style.opacity=0;s.style.transform='scale(.9) translateY(-20px)';swirl(b);setTimeout(()=>{pick(+b.dataset.i);render()},650)})}
let emptyLogged=false;
async function results(){
 const l=match();
 if(!l.length&&!emptyLogged&&ready){emptyLogged=true;try{await db.doc('alerts/'+uid()).set({kind:'empty',who:Q.name,occ:Q.occ,clo:CLO[Q.clo],bud:Q.clo===3?'Under 1500 (2nd cousin+)':(TIER.find(t=>t[0]===Q.bud)||[])[1],ts:Date.now()})}catch(e){}}
 const done=Q.outcome||Q.mine.size;
 frame(`<h2>Gifts picked for you, ${esc(Q.name)}</h2><p class="small">Reserve as many as you like — it stays a surprise for Tithi.</p>`+
 (l.length?l.map(i=>`<div class="card" style="margin:10px 0"><div class="gift">${i.image?`<img src="${esc(i.image)}" alt="">`:'<div class="thumb" style="display:grid;place-items:center;font-size:1.8rem">🎁</div>'}<div><b>${esc(i.name)}</b>${i.price?`<div style="color:var(--gold)">₹${esc(i.price)}</div>`:''}<div class="small">${esc((i.categories||[]).join(' · '))}</div>${/^https?:\/\//i.test(i.link||'')?`<div><a href="${esc(i.link)}" target="_blank" rel="noopener noreferrer" style="color:var(--gold)">View product ↗</a></div>`:''}${i.desc?`<div style="margin-top:6px;font-style:italic">“${esc(i.desc)}”</div>`:''}</div></div><button class="${Q.mine.has(i.id)?'chip on':'go'}" style="margin-top:10px" data-r="${i.id}">${Q.mine.has(i.id)?'✓ Reserved (tap to undo)':'Confirm / reserve gift'}</button></div>`).join(''):'<p>No gifts remaining in the category you chose — Tithi will add more soon ✨</p>')+
 (Q.mine.size?'':`<button class="opt" id="sur">I’m gonna surprise Tithi with something else</button>`)+`<button class="opt" id="ret">Retake quiz</button>`+
 (done?`<button class="go opt" id="fin">End quiz</button>`:''));
 document.querySelectorAll('[data-r]').forEach(b=>b.onclick=()=>reserve(b.dataset.r));
 if($('sur'))$('sur').onclick=()=>{Q.outcome='surprise';render()};
 $('ret').onclick=()=>{Q={step:'occ',name:Q.name,mine:new Set()};emptyLogged=false;render()};
 if($('fin'))$('fin').onclick=()=>{Q.step='end';render()}}
async function reserve(id){const it=items.find(i=>i.id===id);
 if(Q.mine.has(id)){Q.mine.delete(id);try{await db.doc('res/'+id).delete()}catch(e){}return render()}
 Q.mine.add(id);Q.outcome=null;
 try{await db.doc('res/'+id).set({itemId:id,name:Q.name,ts:Date.now()});
  const rs=new Set([...resIds(),id]);
  for(const c of it.categories||[]){const left=items.filter(x=>x.status!=='wishlist'&&!rs.has(x.id)&&(x.categories||[]).includes(c));
   if(!left.length)await db.doc('alerts/'+uid()).set({kind:'category',cat:c,item:it.name,who:Q.name,ts:Date.now()})}}catch(e){}
 render()}
// ---------- OWNER ----------
let ownerOk=null,showTakers=false,F=null;
const fresh=()=>({name:'',price:'',link:'',desc:'',cats:new Set(),tiers:new Set(),occ:new Set(),clo:new Set(),img:'',wish:false,custom:[]});
async function owner(){
 F=F||fresh();
 const base=location.href.split('#')[0],rs=resIds(),stock=items.filter(i=>i.status!=='wishlist'),wish=items.filter(i=>i.status==='wishlist');
 const taken={};attempts.forEach(a=>{const k=(a.name||'').trim();taken[k]=(taken[k]||0)+1});
 const cats=[...new Set([...CATS0,...items.flatMap(i=>i.categories||[]),...F.custom])];
 const chips=(arr,set,k)=>arr.map(([v,l])=>`<span class="chip ${F[set].has(v)?'on':''}" data-s="${set}" data-v="${esc(v)}">${esc(l)}</span>`).join('');
 keep();const old=document.activeElement&&document.activeElement.id;
 app.innerHTML=`<div class="hero enter"><svg width="170" height="110" viewBox="0 0 170 110" class="float"><path fill="#ffd98a" d="M20 110V60h14v-12h8v12h12V30l8-14 8 14v30h12V50h8v10h14v50z" opacity=".9"/><g fill="#fff"><circle class="st" cx="20" cy="20" r="2"/><circle class="st" cx="140" cy="14" r="2.5"/><circle class="st" cx="100" cy="36" r="1.6"/><circle class="st" cx="52" cy="10" r="1.8"/></g><text x="64" y="76" font-size="26">🔮</text></svg><h1>Owner’s Tower</h1><button id="bk">← Back to quiz</button></div>
 <div class="card enter"><b>Share links</b><p class="small">Quiz link (give to guests):</p><input type="text" readonly value="${esc(base)}" onclick="this.select()"><p class="small">Owner link (asks for the password):</p><input type="text" readonly value="${esc(base+'#owner')}" onclick="this.select()"></div>
 <div class="stats enter"><div class="card stat"><b>${stock.length}</b>Total items</div><div class="card stat"><b>${rs.size}</b>Reserved</div><div class="card stat"><b>${wish.length}</b>Wishlist</div></div>
 <div class="card enter row"><div><b>🛡️ Surprise Shield</b><div class="small">${shield?'ON — reserved gifts vanish from the quiz so no one sees what others picked.':'OFF — reserved gifts stay visible in the quiz.'}</div></div><button class="sw ${shield?'on':''}" id="shield" aria-label="Surprise shield"></button></div>
 <div class="card enter alert"><b>🔔 Restock alerts (${alerts.length})</b>${alerts.length?alerts.sort((a,b)=>b.ts-a.ts).map(a=>`<div class="row" style="margin-top:8px"><span>${a.kind==='category'?`No gifts left in <b>${esc(a.cat)}</b> after ${esc(a.who)} reserved “${esc(a.item)}”`:`${esc(a.who)} chose <b>${esc(a.occ)}</b> · ${esc(a.clo)} · ${esc(a.bud)} — nothing matched`}</span><button data-d="${a.id}">Dismiss</button></div>`).join(''):'<p class="small">All stocked. ✨</p>'}</div>
 <div class="card enter"><h2>➕ Add new item</h2><input type="text" id="fn" placeholder="Product name (optional)" value="${esc(F.name)}"><input type="number" id="fp" placeholder="Price in ₹ (optional)" value="${esc(F.price)}"><input type="text" id="fl" placeholder="Product link (optional)" value="${esc(F.link)}"><textarea id="fd" rows="3" placeholder="Description / note from me (optional)" style="width:100%;padding:11px;border-radius:10px;border:1px solid var(--line);background:rgba(0,0,0,.35);color:var(--ink);font:inherit;margin:6px 0">${esc(F.desc)}</textarea>
 <p class="small">Category (pick several)</p>${cats.map(c=>`<span class="chip ${F.cats.has(c)?'on':''}" data-s="cats" data-v="${esc(c)}">${esc(c)}</span>`).join('')}<input type="text" id="fc" placeholder="New category + Enter">
 <p class="small">Budget tier</p>${chips(TIER.slice(0,4),'tiers')}<p class="small">Occasion</p>${chips(OCC.map(o=>[o,o]),'occ')}<p class="small">Closeness</p>${chips(CLO.map((c,i)=>[i,c]),'clo')}
 <p class="small">Images (optional)</p>${F.img?`<img class="thumb" src="${esc(F.img)}" alt=""> `:''}<input type="file" id="ff" accept="image/*">
 <p><label><input type="checkbox" id="fw" ${F.wish?'checked':''}> Wishlist only (not offered in quiz yet)</label></p><button class="go" id="add">Add item</button></div>
 <div class="card enter"><h2>🎁 In stock</h2>${stock.map(itemRow(rs)).join('')||'<p class="small">Nothing yet.</p>'}</div>
 <div class="card enter"><h2>🌠 Wishlist items</h2>${wish.map(itemRow(rs)).join('')||'<p class="small">Empty.</p>'}</div>
 <div class="card enter"><div class="row"><h2>👥 Quiz takers</h2><button id="tk">${showTakers?'Hide':'Show'} names</button></div>${showTakers?(Object.keys(taken).length?Object.entries(taken).sort((a,b)=>b[1]-a[1]).map(([n,c])=>`<div class="row"><span>${esc(n)}</span><b>${c}×</b></div>`).join(''):'<p class="small">No one yet.</p>'):`<p class="small">${attempts.length} attempts hidden.</p>`}</div>`;
 if(old&&$(old)){$(old).focus()}
 wire()}
function itemRow(rs){return i=>{const r=res.find(x=>x.itemId===i.id);return `<div class="gift row" style="margin:8px 0"><div class="gift">${i.image?`<img class="thumb" src="${esc(i.image)}" alt="">`:'<div class="thumb" style="display:grid;place-items:center">🎁</div>'}<div><b>${esc(i.name||'Untitled')}</b><div class="small">${esc((i.categories||[]).join(', '))}${i.price?' · ₹'+esc(i.price):''}${r?' · reserved by '+esc(r.name):''}</div></div></div><div><button data-t="${i.id}">${i.status==='wishlist'?'Move to stock':'To wishlist'}</button> <button data-x="${i.id}">✕</button></div></div>`}}
function wire(){
 document.querySelectorAll('[data-s]').forEach(c=>c.onclick=()=>{keep();const s=F[c.dataset.s],v=c.dataset.s==='clo'?+c.dataset.v:c.dataset.v;s.has(v)?s.delete(v):s.add(v);render()});
 $('shield').onclick=()=>db.doc('cfg/shield').set({on:!shield});
 $('tk').onclick=()=>{showTakers=!showTakers;render()};$('bk').onclick=()=>{signOut(auth);ownerMode=false;Q={step:'name',mine:new Set()};render()};
 document.querySelectorAll('[data-d]').forEach(b=>b.onclick=()=>db.doc('alerts/'+b.dataset.d).delete());
 document.querySelectorAll('[data-x]').forEach(b=>b.onclick=()=>{if(confirm('Remove this item?'))db.doc('items/'+b.dataset.x).delete()});
 document.querySelectorAll('[data-t]').forEach(b=>b.onclick=()=>{const i=items.find(x=>x.id===b.dataset.t);db.doc('items/'+i.id).update({status:i.status==='wishlist'?'stock':'wishlist'})});
 $('fc').onkeydown=e=>{if(e.key==='Enter'&&e.target.value.trim()){keep();const v=e.target.value.trim();F.custom.push(v);F.cats.add(v);render()}};
 if($('ff'))$('ff').onchange=async e=>{keep();const f=e.target.files[0];if(!f)return;try{F.img=await shrink(f)}catch(x){alert('Upload failed')}render()};
 $('add').onclick=async()=>{keep();if(!F.name&&!F.cats.size&&!F.img){alert('Add at least a name, category or image.');return}
  await db.doc('items/'+uid()).set({name:F.name||'Untitled gift',price:F.price,link:F.link,desc:F.desc,categories:[...F.cats],tiers:[...F.tiers],occasions:[...F.occ],closeness:[...F.clo],image:F.img,status:F.wish?'wishlist':'stock',ts:Date.now()});F=fresh();render()}}
function keep(){if(!F||!$('fn'))return;F.name=$('fn').value;F.price=$('fp').value;F.link=$('fl').value;F.desc=$('fd').value;F.wish=$('fw').checked}
function render(){if(!ready)return;if(isOwnerView())owner();else quiz()}
init();
</script></body></html>
